# Gera o pacote do app Android (AAB para a Play Store e APK para teste, sem assinatura) quando a pasta android/ muda.
# O resultado vai para o branch "build-android"; a assinatura é feita fora do GitHub com a chave de upload.
name: App Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Gerar AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:bundleRelease :app:assembleRelease 2>&1 | tee ../build.log
      - name: Publicar no branch build-android
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/build-${{ github.run_number }}.log || true
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/out/plantacalc-${{ github.run_number }}-sem-assinatura.aab || true
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/out/plantacalc-${{ github.run_number }}-sem-assinatura.apk || true
          cd /tmp/out
          git init -q
          git checkout -q -b build-android
          git add .
          git -c user.name="PlantaCalc CI" -c user.email="ci@plantacalc.com.br" commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-android
