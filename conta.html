<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha conta — PlantaCalc</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
.fld select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid #d3d9de;border-radius:11px;background:#fff}
.fld select:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 4px rgba(46,125,50,.12)}
.fld small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 92px;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mut);margin:2px 0 14px}.chk input{width:18px;height:18px;margin-top:2px;flex:none}
.acc h2{font-size:19px;margin:0 0 4px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:6px 0;border-bottom:1px dashed var(--line)}.kv span{color:var(--mut)}
.perigo{color:#8a1c12!important}
.btn.pix{background:#32bcad;border-color:#32bcad;color:#fff;width:100%}.btn.pix2{border-color:#32bcad;color:#0f766e}
.ck{position:fixed;inset:0;background:rgba(15,23,32,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:24px 12px}
.ck .cx{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
.ck h2{font-size:20px;margin:0 0 2px}.ck .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:26px;line-height:1;color:var(--mut);cursor:pointer}
.ck .tabs{display:flex;gap:6px;background:#f1f4f6;border-radius:12px;padding:4px;margin:14px 0}
.ck .tabs button{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:10px;border-radius:9px;cursor:pointer;color:var(--mut)}
.ck .tabs button.on{background:#fff;color:var(--ink,#1b2733);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ck .qr{display:block;width:230px;height:230px;margin:6px auto 10px;border:1px solid var(--line);border-radius:12px}
.ck textarea{width:100%;font:12.5px 'IBM Plex Mono',monospace;border:1.5px solid #d3d9de;border-radius:10px;padding:8px;resize:none;height:64px;box-sizing:border-box}
.ck .esp{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px;color:var(--mut);margin:10px 0 0}
.ck .dot{width:9px;height:9px;border-radius:50%;background:#32bcad;animation:pc 1.2s infinite}@keyframes pc{50%{opacity:.25}}
.ck .ok{text-align:center;padding:10px 0}.ck .ok b{display:block;font-size:20px;color:var(--g2);margin:6px 0}
.ck .seg{font-size:12.5px;color:var(--mut);text-align:center;margin:12px 0 0}
details.cad summary{cursor:pointer;font-weight:600;color:var(--g2);margin-bottom:12px}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="logo" href="index.html"><img src="img/icone.svg" alt="">PlantaCalc</a>
  <div class="sp"></div>
  <a class="btn pri sm" href="app.html">Abrir o PlantaCalc</a>
</div></header>

<div class="acc"><div class="card" id="box"><p class="m">Carregando…</p></div></div>

<script>
(function(){
var C=window.PC_CFG||{};var box=document.getElementById('box');var Q=new URLSearchParams(location.search);var VOLTA=Q.get('volta')==='app';
var brl=function(v){return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var base=(C.site||location.origin).replace(/\/$/,'');
if(!C.supabaseUrl||!window.supabase){box.innerHTML='<h1>Minha conta</h1><p class="m">As contas ainda não foram ativadas neste site. Enquanto isso, o PlantaCalc funciona normalmente no plano gratuito.</p><a class="btn pri" href="app.html">Abrir o PlantaCalc</a>';return;}
var sb=window.supabase.createClient(C.supabaseUrl,C.supabaseKey);var modo='entrar',user=null;

function msg(t,ok){var m=document.getElementById('msg');if(!m)return;m.textContent=t;m.className='msg on '+(ok?'ok':'err');}
function ocupado(b,t){b.disabled=true;b.dataset.t=b.textContent;b.textContent=t;}
function livre(b){b.disabled=false;if(b.dataset.t)b.textContent=b.dataset.t;}

var PROF=['Engenheiro(a) civil','Engenheiro(a) de outra área','Arquiteto(a)','Técnico(a) em edificações','Projetista / desenhista','Construtor(a) / empreiteiro(a)','Orçamentista','Estudante','Outra'];
var UFS='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
function opts(l,v){return '<option value="">Selecione…</option>'+l.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>';}).join('');}
function camposCadastro(c){c=c||{};return '<label class="fld"><span>Nome completo *</span><input id="cNome" autocomplete="name" required maxlength="120" value="'+esc(c.nome)+'"></label>'+
 '<label class="fld"><span>Profissão *</span><select id="cProf" required>'+opts(PROF,c.profissao)+'</select></label>'+
 '<label class="fld"><span>Empresa ou escritório</span><input id="cEmp" autocomplete="organization" maxlength="120" value="'+esc(c.empresa)+'"><small>Opcional.</small></label>'+
 '<div class="g2"><label class="fld"><span>Cidade</span><input id="cCid" autocomplete="address-level2" maxlength="80" value="'+esc(c.cidade)+'"></label><label class="fld"><span>UF</span><select id="cUf">'+opts(UFS,c.uf)+'</select></label></div>'+
 '<label class="fld"><span>WhatsApp</span><input id="cTel" type="tel" autocomplete="tel" maxlength="20" placeholder="(31) 99999-9999" value="'+esc(c.telefone)+'"><small>Opcional — só para suporte.</small></label>'+
 '<label class="chk"><input type="checkbox" id="cNov"'+(c.novidades?' checked':'')+'><span>Quero receber por e-mail novidades e dicas do PlantaCalc (no máximo 2 por mês; dá para sair a qualquer momento).</span></label>';}
function lerCadastro(){var v=function(i){return (document.getElementById(i).value||'').trim();};return {nome:v('cNome'),profissao:v('cProf'),empresa:v('cEmp'),cidade:v('cCid'),uf:v('cUf'),telefone:v('cTel'),novidades:document.getElementById('cNov').checked};}

function telaLogin(){
 var titulo={entrar:'Entrar',criar:'Criar conta',senha:'Recuperar senha'}[modo];
 var assinar=Q.get('assinar');
 box.innerHTML='<h1>'+titulo+'</h1><p class="m">'+(assinar?'Entre ou crie sua conta para assinar o PlantaCalc Pro.':VOLTA&&modo!=='senha'?'Para usar o PlantaCalc — inclusive no plano gratuito — entre ou crie sua conta. É grátis e leva menos de 1 minuto.':modo==='senha'?'Enviaremos um link para você criar uma nova senha.':modo==='criar'?'Grátis. Com a conta, seus projetos ficam guardados na nuvem e abrem em qualquer computador ou tablet.':'Entre para ver seus projetos na nuvem e o seu plano.')+'</p>'+
  '<form id="f">'+(modo==='criar'?camposCadastro():'')+'<label class="fld"><span>E-mail</span><input type="email" id="em" autocomplete="email" required></label>'+
  (modo!=='senha'?'<label class="fld"><span>Senha</span><input type="password" id="pw" minlength="8" autocomplete="'+(modo==='criar'?'new-password':'current-password')+'" required>'+(modo==='criar'?'<small>Mínimo de 8 caracteres.</small>':'')+'</label>':'')+
  (modo==='criar'?'<p class="m" style="font-size:13.5px;margin:-4px 0 12px">Ao criar a conta você concorda com os <a href="termos.html" target="_blank">Termos de uso</a> e a <a href="privacidade.html" target="_blank">Política de privacidade</a>.</p>':'')+
  '<button class="btn pri" id="go">'+({entrar:'Entrar',criar:'Criar conta',senha:'Enviar link'}[modo])+'</button></form><div id="msg" class="msg"></div>'+
  '<div class="alt">'+(modo==='entrar'?'<button class="lnk" data-m="criar">Criar uma conta</button><button class="lnk" data-m="senha">Esqueci a senha</button>':'<button class="lnk" data-m="entrar">Já tenho conta — entrar</button>')+'</div>';
 box.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){modo=b.dataset.m;telaLogin();};});
 document.getElementById('f').onsubmit=async function(e){e.preventDefault();var b=document.getElementById('go');var em=document.getElementById('em').value.trim();var pw=(document.getElementById('pw')||{}).value;ocupado(b,'Aguarde…');
  try{var r;var volta=base+'/conta.html'+(assinar?'?assinar='+encodeURIComponent(assinar):VOLTA?'?volta=app':'');
   if(modo==='entrar'){r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;}
   else if(modo==='criar'){var cad=lerCadastro();if(!cad.nome||!cad.profissao){livre(b);msg('Preencha o nome e a profissão.');return;}r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:volta,data:cad}});if(r.error)throw r.error;if(!r.data.session){livre(b);msg('Conta criada. Enviamos um e-mail de confirmação para '+em+' — abra o link para ativar e voltar aqui.',true);return;}}
   else{r=await sb.auth.resetPasswordForEmail(em,{redirectTo:base+'/conta.html?nova=1'});if(r.error)throw r.error;livre(b);msg('Se existir uma conta com esse e-mail, o link chega em alguns minutos.',true);return;}
  }catch(x){livre(b);var t=String(x.message||x);msg(/Invalid login/i.test(t)?'E-mail ou senha incorretos.':/already registered/i.test(t)?'Já existe uma conta com esse e-mail. Use “Entrar”.':/Email not confirmed/i.test(t)?'Confirme o e-mail antes de entrar (veja sua caixa de entrada).':'Não foi possível concluir: '+t);}};}

function telaNovaSenha(){box.innerHTML='<h1>Nova senha</h1><p class="m">Digite a nova senha da sua conta.</p><form id="f"><label class="fld"><span>Nova senha</span><input type="password" id="pw" minlength="8" autocomplete="new-password" required></label><button class="btn pri" id="go">Salvar senha</button></form><div id="msg" class="msg"></div>';
 document.getElementById('f').onsubmit=async function(e){e.preventDefault();var b=document.getElementById('go');ocupado(b,'Salvando…');var r=await sb.auth.updateUser({password:document.getElementById('pw').value});livre(b);if(r.error)msg('Não foi possível salvar: '+r.error.message);else{msg('Senha alterada.',true);setTimeout(carregar,900);}};}

async function perfil(sync){if(sync){try{var s=await sb.functions.invoke('assinatura',{body:{acao:'status'}});if(s.data&&s.data.plano)return s.data;}catch(e){}}
 var r=await sb.from('perfis').select('plano,validade,mp_status,ciclo').eq('id',user.id).single();return r.data||{plano:'gratis'};}

async function motivo(r){try{if(r.data&&r.data.erro)return r.data.erro;if(r.error&&r.error.context&&r.error.context.json){var j=await r.error.context.json();return j&&j.erro;}}catch(e){}return '';}
function erroMP(t){t=String(t||'');return (t&&t!=='falha'?'Motivo informado pelo Mercado Pago: '+t+'.':'Tente de novo em instantes.')+(/yourself|same|mesm|collector|payer|between/i.test(t)?' (A conta que recebe os pagamentos não pode pagar a si mesma: use outro e-mail.)':'');}
var CK=null;
function fecharCheckout(){if(!CK)return;clearInterval(CK.poll);clearInterval(CK.rel);try{CK.brick&&CK.brick.unmount();}catch(e){}CK.el.remove();CK=null;}
function sdkMP(){return new Promise(function(ok,no){if(window.MercadoPago)return ok();var s=document.createElement('script');s.src='https://sdk.mercadopago.com/js/v2';s.onload=ok;s.onerror=function(){no(new Error('não foi possível carregar o formulário do Mercado Pago'));};document.head.appendChild(s);});}
function abrirCheckout(ciclo,metodo){fecharCheckout();var P=C.preco||{mensal:29.9,anual:299};var valor=P[ciclo];
 var el=document.createElement('div');el.className='ck';el.innerHTML='<div class="cx" role="dialog" aria-modal="true"><button class="x" aria-label="Fechar">×</button><h2>PlantaCalc Pro</h2><p class="m" style="margin:0" id="ckSub"></p>'+
  '<div class="tabs"><button data-m="pix">Pix</button><button data-m="cartao">Cartão de crédito</button></div><div id="ckCorpo"></div><div id="ckMsg" class="msg"></div><p class="seg">🔒 Pagamento processado com segurança pelo Mercado Pago. O PlantaCalc não vê nem guarda os dados do seu cartão.</p></div>';
 document.body.appendChild(el);CK={el:el,ciclo:ciclo};
 el.querySelector('.x').onclick=fecharCheckout;el.addEventListener('click',function(e){if(e.target===el)fecharCheckout();});
 el.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){modo(b.dataset.m);};});
 function cmsg(t,ok){var m=document.getElementById('ckMsg');if(!m)return;m.textContent=t||'';m.className=t?'msg on '+(ok?'ok':'err'):'msg';}
 function sucesso(t){clearInterval(CK.poll);clearInterval(CK.rel);try{CK.brick&&CK.brick.unmount();}catch(e){}CK.brick=null;cmsg('');document.querySelector('.ck .tabs').style.display='none';
  document.getElementById('ckCorpo').innerHTML='<div class="ok"><div style="font-size:42px">✅</div><b>Pagamento aprovado!</b><p class="m">'+t+'</p><button class="btn pri" id="ckOk">Continuar</button></div>';
  document.getElementById('ckOk').onclick=function(){fecharCheckout();telaConta(true);};}
 function modo(m){if(!CK)return;clearInterval(CK.poll);clearInterval(CK.rel);try{CK.brick&&CK.brick.unmount();}catch(e){}CK.brick=null;cmsg('');CK.metodo=m;
  el.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
  var sub=document.getElementById('ckSub'),corpo=document.getElementById('ckCorpo');
  if(m==='pix'){sub.innerHTML=(ciclo==='anual'?'12 meses':'1 mês')+' por <b>'+brl(valor)+'</b> · pagamento único, sem renovação automática';
   corpo.innerHTML='<div style="display:flex;gap:6px;margin:0 0 12px"><button class="btn '+(ciclo==='anual'?'pix':'sec')+'" data-c="anual" style="flex:1;margin:0">12 meses</button><button class="btn '+(ciclo==='mensal'?'pix':'sec')+'" data-c="mensal" style="flex:1;margin:0">1 mês</button></div><p class="m" style="text-align:center">Gerando o QR code…</p>';
   corpo.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){if(CK.ciclo!==b.dataset.c){ciclo=CK.ciclo=b.dataset.c;valor=P[ciclo];modo('pix');}};});
   gerarPix(corpo);}
  else{sub.innerHTML=(ciclo==='anual'?'Anual':'Mensal')+' · <b>'+brl(valor)+'</b> por '+(ciclo==='anual'?'ano':'mês')+' · renova sozinho, cancele quando quiser';
   corpo.innerHTML='<div style="display:flex;gap:6px;margin:0 0 12px"><button class="btn '+(ciclo==='anual'?'pri':'sec')+'" data-c="anual" style="flex:1;margin:0">Anual</button><button class="btn '+(ciclo==='mensal'?'pri':'sec')+'" data-c="mensal" style="flex:1;margin:0">Mensal</button></div><div id="ckCard"><p class="m" style="text-align:center">Carregando o formulário seguro…</p></div>';
   corpo.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){if(CK.ciclo!==b.dataset.c){ciclo=CK.ciclo=b.dataset.c;valor=P[ciclo];modo('cartao');}};});
   montarCartao();}}
 async function gerarPix(corpo){var c0=ciclo;var r=await sb.functions.invoke('assinatura',{body:{acao:'pixqr',ciclo:ciclo}});if(!CK||CK.metodo!=='pix'||c0!==ciclo)return;
  if(r.error||!r.data||!r.data.qr){var t=await motivo(r);corpo.querySelector('p.m').textContent='';cmsg('Não foi possível gerar o Pix. '+erroMP(t));return;}
  var d=r.data;corpo.querySelector('p.m').outerHTML='<p class="m" style="text-align:center;margin:0">Abra o app do seu banco, escolha <b>Pix → Ler QR code</b> e aponte para a imagem. Ou copie o código.</p>'+
   (d.qr64?'<img class="qr" alt="QR code do Pix" src="data:image/png;base64,'+d.qr64+'">':'')+'<textarea readonly id="ckCod">'+esc(d.qr)+'</textarea><button class="btn pix" id="ckCop" style="margin-top:8px">Copiar código Pix</button><div class="esp"><span class="dot"></span><span id="ckEsp">Aguardando o pagamento…</span></div>';
  document.getElementById('ckCop').onclick=async function(){var b=this;try{await navigator.clipboard.writeText(d.qr);}catch(e){var ta=document.getElementById('ckCod');ta.select();document.execCommand('copy');}b.textContent='Código copiado ✓';setTimeout(function(){if(b.isConnected)b.textContent='Copiar código Pix';},2500);};
  var fim=d.expira?new Date(d.expira).getTime():Date.now()+30*60e3;
  CK.rel=setInterval(function(){var s=Math.max(0,Math.round((fim-Date.now())/1000));var e=document.getElementById('ckEsp');if(e)e.textContent=s?'Aguardando o pagamento… (o código vale por '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+')':'O código expirou. Toque em “Pix” para gerar outro.';if(!s){clearInterval(CK.poll);clearInterval(CK.rel);}},1000);
  CK.poll=setInterval(async function(){try{var v=await sb.functions.invoke('assinatura',{body:{acao:'pixver',id:d.id}});if(v.data&&v.data.status==='approved')sucesso('O PlantaCalc Pro está liberado'+(v.data.perfil&&v.data.perfil.validade?' até '+new Date(v.data.perfil.validade).toLocaleDateString('pt-BR'):'')+'.');else if(v.data&&/rejected|cancelled/.test(v.data.status||'')){clearInterval(CK.poll);cmsg('O Pix foi cancelado ou expirou. Toque em “Pix” para gerar outro.');}}catch(e){}},4000);}
 async function montarCartao(){var c0=ciclo;try{if(!C.mpPublicKey)throw new Error('pagamento por cartão indisponível no momento');await sdkMP();if(!CK||CK.metodo!=='cartao'||c0!==ciclo)return;
   var mpo=new MercadoPago(C.mpPublicKey,{locale:'pt-BR'});document.getElementById('ckCard').innerHTML='<div id="ckBrick"></div>';
   CK.brick=await mpo.bricks().create('cardPayment','ckBrick',{initialization:{amount:valor,payer:{email:user.email}},
    customization:{paymentMethods:{maxInstallments:1,types:{excluded:['debit_card']}},visual:{hidePaymentButton:false,texts:{formSubmit:'Assinar '+(ciclo==='anual'?'anual':'mensal')+' — '+brl(valor)}}},
    callbacks:{onReady:function(){},onError:function(e){console.warn(e);},
     onSubmit:function(fd){cmsg('');return new Promise(async function(ok,no){try{var r=await sb.functions.invoke('assinatura',{body:{acao:'cartao',ciclo:ciclo,token:fd.token}});
      if(r.error||!r.data||!r.data.ok){var t=await motivo(r);cmsg('O cartão não foi aceito. '+erroMP(t));no();return;}ok();
      var pf=r.data.perfil;if(pf&&pf.plano==='pro')sucesso('Assinatura '+(ciclo==='anual'?'anual':'mensal')+' ativa. O PlantaCalc Pro está liberado'+(pf.validade?' até '+new Date(pf.validade).toLocaleDateString('pt-BR'):'')+' e renova sozinho.');
      else sucesso('Recebemos a sua assinatura. Assim que o Mercado Pago confirmar a cobrança, o Pro é liberado (normalmente em poucos minutos).');}catch(x){cmsg('O cartão não foi aceito. '+erroMP(x.message));no();}});}}});
  }catch(x){var cc=document.getElementById('ckCard');if(cc)cc.innerHTML='';cmsg('Não foi possível abrir o pagamento por cartão. '+String(x.message||'')+'. Você pode pagar com Pix.');}}
 modo(metodo==='cartao'?'cartao':'pix');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharCheckout();});

async function cadastro(){var r=await sb.from('cadastros').select('nome,profissao,empresa,cidade,uf,telefone,novidades').eq('id',user.id).maybeSingle();return r.data||{};}
async function nProjetos(){try{var r=await sb.from('projetos').select('id',{count:'exact',head:true});return r.count||0;}catch(e){return 0;}}
async function telaConta(sync){box.innerHTML='<p class="m">Carregando…</p>';if(Q.get('volta')==='admin'){location.replace('admin.html');return;}var res=await Promise.all([perfil(sync),cadastro(),nProjetos()]);var p=res[0],cad=res[1],np=res[2];var incompleto=!cad.nome||!cad.profissao;if(VOLTA&&!incompleto&&!Q.get('assinar')){location.replace('app.html');return;}
 if(VOLTA&&incompleto&&!Q.get('assinar')){box.innerHTML='<h1>Complete seu cadastro</h1><p class="m">Falta pouco: preencha seus dados para começar a usar o PlantaCalc.</p><form id="fc">'+camposCadastro(cad)+'<button class="btn pri" id="bCad">Salvar e abrir o PlantaCalc</button></form><div id="msgc" class="msg"></div><div class="alt"><button class="lnk" id="bS">Sair</button></div>';
  document.getElementById('bS').onclick=async function(){await sb.auth.signOut();user=null;modo='entrar';telaLogin();};
  document.getElementById('fc').onsubmit=async function(e){e.preventDefault();var b=document.getElementById('bCad'),mc=document.getElementById('msgc'),c=lerCadastro();
   if(!c.nome||!c.profissao){mc.textContent='Preencha o nome e a profissão.';mc.className='msg on err';return;}ocupado(b,'Salvando…');c.id=user.id;c.atualizado=new Date().toISOString();
   var r=await sb.from('cadastros').upsert(c);if(r.error){livre(b);mc.textContent='Não foi possível salvar: '+r.error.message;mc.className='msg on err';return;}location.replace('app.html');};
  return;}
 var ativo=p.plano==='pro'&&p.validade&&new Date(p.validade)>new Date();var ate=p.validade?new Date(p.validade).toLocaleDateString('pt-BR'):'';var pix=p.mp_status==='pix';var cancelada=pix||/cancel|paused/.test(p.mp_status||'');
 var P=C.preco||{mensal:29.9,anual:299};
 box.innerHTML='<h1>Minha conta</h1><p class="m">'+(cad.nome?esc(cad.nome)+' · ':'')+esc(user.email)+'</p>'+
  '<div class="st"><div style="flex:1"><b>'+(ativo?'Plano Pro':'Plano Gratuito')+'</b><div class="m" style="margin:2px 0 0;font-size:14px">'+(ativo?(pix?'Pago com Pix · válido até '+ate+' (sem renovação automática).':cancelada?'Assinatura cancelada — o Pro continua até '+ate+'.':'Renovação automática · válido até '+ate):p.mp_status==='pending'?'Você começou uma assinatura e não concluiu o pagamento. Escolha abaixo como pagar.':'1 projeto, metade do quantitativo, sem exportar arquivos e com anúncios.')+'</div></div><span class="pill'+(ativo?'':' f')+'">'+(ativo?'PRO':'GRÁTIS')+'</span></div>'+
  (ativo&&!cancelada?'':'<p class="m" style="font-size:14px;margin:0 0 8px"><b>Cartão de crédito</b> — renova sozinho, cancele quando quiser</p><button class="btn pri" id="bA">Assinar anual — '+brl(P.anual)+'</button><button class="btn sec" id="bM" style="margin-top:10px">Assinar mensal — '+brl(P.mensal)+'</button>'+
   '<p class="m" style="font-size:14px;margin:16px 0 8px"><b>Pix</b> — pagamento único, sem renovação automática'+(ativo?' (soma ao período atual)':'')+'</p><button class="btn pix" id="bPA">Pix: 12 meses — '+brl(P.anual)+'</button><button class="btn sec pix2" id="bPM" style="margin-top:10px">Pix: 1 mês — '+brl(P.mensal)+'</button><p class="m" style="font-size:13.5px;margin:10px 0 0">Você paga aqui mesmo, sem sair do site (processado pelo Mercado Pago). O Pro é liberado assim que o pagamento é aprovado.</p>')+
  '<div id="msg" class="msg"></div><div class="sep"></div>'+
  '<h2>Meus projetos</h2><div class="kv"><span>Guardados na nuvem</span><b>'+np+(ativo?'':' de 1')+'</b></div><p class="m" style="font-size:13.5px;margin:8px 0 12px">'+(ativo?'Plano Pro: projetos ilimitados na nuvem.':'O plano gratuito permite 1 projeto, mostra metade do quantitativo e não exporta arquivos. O Pro libera tudo.')+'</p>'+
  '<a class="btn sec" href="app.html">Abrir o PlantaCalc</a><div class="sep"></div>'+
  '<details class="cad"'+(incompleto?' open':'')+'><summary>Meu cadastro'+(incompleto?' (complete, por favor)':'')+'</summary>'+(incompleto?'<p class="m" style="font-size:14px;margin:0 0 12px">Para usar o PlantaCalc, preencha pelo menos o <b>nome</b> e a <b>profissão</b>.</p>':'')+'<form id="fc">'+camposCadastro(cad)+'<button class="btn pri" id="bCad">Salvar cadastro</button></form><div id="msgc" class="msg"></div></details>'+
  '<div class="alt"><button class="lnk" id="bAt">Atualizar situação</button>'+(ativo&&!cancelada?'<button class="lnk" id="bC" style="color:#8a1c12">Cancelar assinatura</button>':'')+'<button class="lnk" id="bS">Sair</button></div><div class="alt" style="justify-content:flex-end"><button class="lnk perigo" id="bX">Excluir minha conta</button></div>';
 var bA=document.getElementById('bA'),bM=document.getElementById('bM'),bPA=document.getElementById('bPA'),bPM=document.getElementById('bPM');if(bA)bA.onclick=function(){abrirCheckout('anual','cartao');};if(bM)bM.onclick=function(){abrirCheckout('mensal','cartao');};if(bPA)bPA.onclick=function(){abrirCheckout('anual','pix');};if(bPM)bPM.onclick=function(){abrirCheckout('mensal','pix');};
 document.getElementById('bAt').onclick=function(){telaConta(true);};
 document.getElementById('fc').onsubmit=async function(e){e.preventDefault();var b=document.getElementById('bCad');var c=lerCadastro();var mc=document.getElementById('msgc');
  if(!c.nome||!c.profissao){mc.textContent='Preencha o nome e a profissão.';mc.className='msg on err';return;}ocupado(b,'Salvando…');c.id=user.id;c.atualizado=new Date().toISOString();
  var r=await sb.from('cadastros').upsert(c);livre(b);if(r.error){mc.textContent='Não foi possível salvar: '+r.error.message;mc.className='msg on err';}else{mc.textContent='Cadastro salvo.';mc.className='msg on ok';if(VOLTA||incompleto){mc.textContent='Cadastro salvo. Abrindo o PlantaCalc…';setTimeout(function(){location.href='app.html';},700);}}};
 document.getElementById('bX').onclick=async function(){var bX=this;var t=prompt('Isto apaga a sua conta, o seu cadastro e os projetos guardados na nuvem, e cancela a assinatura (se houver). Não dá para desfazer.\n\nOs projetos salvos neste aparelho continuam no aparelho.\n\nPara confirmar, digite EXCLUIR:');
  if(!t||t.trim().toUpperCase()!=='EXCLUIR')return;ocupado(bX,'Excluindo…');var r=await sb.functions.invoke('assinatura',{body:{acao:'excluir'}});
  if(r.error||(r.data&&r.data.erro)){livre(bX);msg('Não foi possível excluir agora. Tente de novo ou escreva para '+(C.contato||'o suporte')+'.');return;}
  try{await sb.auth.signOut();}catch(e){}try{localStorage.removeItem('pc_plano_v1');}catch(e){}user=null;box.innerHTML='<h1>Conta excluída</h1><p class="m">Sua conta e seus dados na nuvem foram apagados. Obrigado por usar o PlantaCalc.</p><a class="btn pri" href="index.html">Voltar ao início</a>';};
 document.getElementById('bS').onclick=async function(){await sb.auth.signOut();try{localStorage.removeItem('pc_plano_v1');}catch(e){}user=null;modo='entrar';telaLogin();};
 var bC=document.getElementById('bC');if(bC)bC.onclick=async function(){if(!confirm('Cancelar a renovação do PlantaCalc Pro? Você continua com o Pro até '+ate+'.'))return;ocupado(bC,'Cancelando…');var r=await sb.functions.invoke('assinatura',{body:{acao:'cancelar'}});livre(bC);if(r.error)msg('Não foi possível cancelar agora. Tente de novo.');else telaConta(false);};
 if(Q.get('retorno'))msg(ativo?'Pagamento confirmado. Bem-vindo ao PlantaCalc Pro!':'Recebemos o seu retorno do Mercado Pago. Se você pagou com Pix e ainda não liberou, toque em “Atualizar situação” em 1 ou 2 minutos.',ativo);
 try{localStorage.setItem('pc_plano_v1',JSON.stringify({plano:p.plano,validade:p.validade,ts:Date.now()}));}catch(e){}
 var ass=Q.get('assinar');if(ass)Q.delete('assinar');if(ass&&!ativo&&(ass==='mensal'||ass==='anual')){history.replaceState(null,'','conta.html');abrirCheckout(ass,'cartao');}else if(ass&&!ativo&&/^pix-/.test(ass)){history.replaceState(null,'','conta.html');abrirCheckout(ass==='pix-mensal'?'mensal':'anual','pix');}}

async function carregar(){var s=await sb.auth.getSession();user=s.data.session?s.data.session.user:null;if(Q.get('nova')&&user){telaNovaSenha();return;}if(user)telaConta(!!Q.get('retorno'));else telaLogin();}
sb.auth.onAuthStateChange(function(ev,ses){if(ev==='PASSWORD_RECOVERY'){user=ses.user;telaNovaSenha();return;}var u=ses?ses.user:null;if(ev==='SIGNED_IN'&&(!user||user.id!==u.id)){user=u;telaConta(false);}});
carregar();
})();
