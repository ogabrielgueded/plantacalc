<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administração — PlantaCalc</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
body{font-size:15px}
.adm{max-width:1280px;margin:18px auto 60px;padding:0 16px}
.adm h1{font-size:24px;letter-spacing:-.4px;margin:0 0 2px;max-width:none;text-align:left}.adm h2{font-size:18px;margin:22px 0 8px}.adm h3{font-size:15px;margin:16px 0 6px}
.m{color:var(--mut)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0 16px}
.tabs button{border:0;background:none;font:inherit;font-weight:600;color:var(--mut);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--g1);border-bottom-color:var(--g2)}.tabs .n{display:inline-block;min-width:18px;padding:0 6px;border-radius:10px;background:#a3241a;color:#fff;font-size:11.5px;margin-left:4px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 12px}
.bar label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
select,input.i{font:inherit;font-size:14.5px;padding:7px 9px;border:1px solid #cdd5db;border-radius:8px;background:#fff}
.btn.xs{padding:6px 11px;font-size:13.5px;border-radius:9px}.btn.ln{background:#fff;color:var(--g1);border-color:#cfe0c2}.btn.rd{background:#fff;color:#a3241a;border-color:#f0c8c4}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kp small{display:block;color:var(--mut);font-size:12.5px}.kp b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}.kp i{font-style:normal;font-size:12px;color:var(--mut)}
.kp.up i{color:#1b7a2a}.kp.dn i{color:#a3241a}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.pn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.pn h3{margin:0 0 8px}
.vb{display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:6px;border-bottom:1px solid #c9d1d6;position:relative}
.vb div{flex:1;background:var(--g2);border-radius:4px 4px 0 0;min-height:1px;position:relative;cursor:default}
.vb div:hover{background:var(--g0)}
.vbx{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:3px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.hb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .r{height:12px;background:var(--g2);border-radius:0 4px 4px 0;min-width:2px}.hb .v{font-variant-numeric:tabular-nums;color:var(--mut);text-align:right}
.tip{position:fixed;z-index:60;pointer-events:none;background:#1b2228;color:#fff;font-size:12.5px;padding:5px 8px;border-radius:7px;white-space:nowrap;display:none}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;border-bottom:1.5px solid var(--line);padding:8px;white-space:nowrap;cursor:pointer;background:#fafbf8;position:sticky;top:0}
table.t td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:#f6faf2}table.t tr.sel td{background:#eef6e0}
.bdg{display:inline-block;font-size:11.5px;font-weight:700;border-radius:20px;padding:1px 8px;white-space:nowrap}
.b-pro{background:#e3f2e4;color:#1b5e20}.b-cor{background:#e8eefc;color:#1d4ed8}.b-fre{background:#eef1f3;color:#55606a}.b-blo{background:#fdeeee;color:#a3241a}.b-av{background:#fff2d9;color:#8a5a00}
.box{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}.box.ok{background:#eef8ef;border:1px solid #cfe8d2;color:#1b5e20}.box.av{background:#fff7e6;border:1px solid #f1d9a6;color:#6b4300}.box.er{background:#fdeeee;border:1px solid #f2c5c2;color:#7d1a12}
.det{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:14px}.kv span{color:var(--mut)}
.drop{border:2px dashed #b9c4cc;border-radius:14px;padding:26px 16px;text-align:center;color:var(--mut);cursor:pointer;display:block;margin:12px 0;background:#fff}
.drop.on,.drop:hover{border-color:var(--g2);background:#f3faf3;color:var(--g2)}.drop b{display:block;font-size:16px;color:var(--ink)}
.barra{height:10px;background:#e8edf0;border-radius:6px;overflow:hidden;margin:8px 0 4px}.barra i{display:block;height:100%;width:0;background:var(--g2)}
.mono{font-family:var(--fm);font-size:12.5px}
.ed{background:#f6f8f9;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px}
.res{max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:6px}.res div{padding:6px 8px;border-bottom:1px solid #edf0f2;cursor:pointer;font-size:13px}.res div:hover{background:#eef6e0}
.cmp{display:flex;gap:6px;align-items:center;font-size:13px;margin:4px 0}.cmp input{width:80px}
.vazio{padding:18px;text-align:center;color:var(--mut)}
pre.pl{white-space:pre-wrap;font-size:11.5px;background:#f6f8f9;border-radius:8px;padding:8px;max-height:220px;overflow:auto;margin:6px 0 0}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}.kp b{font-size:19px}}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="sinapi_parse.js"></script>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="logo" href="index.html"><img src="img/icone.svg" alt="">PlantaCalc</a>
  <div class="sp"></div>
  <a class="btn sm sec" href="app.html">Abrir o PlantaCalc</a>
</div></header>
<div class="adm"><div id="box"><p class="m">Carregando…</p></div></div>
<div class="tip" id="tip"></div>
<script type="module" src="admin.js"></script>
</body>
</html>
